# Refreshes the icon data pack twice a month (ADR-017): new items get their icons without anyone
# remembering to do it, and the pack is never older than Blizzard's API terms allow (§2(r): at
# most 30 days; the app ignores older packs). Needs the repository secrets BLIZZARD_CLIENT_ID
# and BLIZZARD_CLIENT_SECRET.
# Belongs in the public release repository next to tools/icons-pack.mjs and data/.
name: Icon pack

on:
  schedule:
    - cron: "0 4 1,15 * *" # 1st and 15th of every month, 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data/icons.json
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node tools/icons-pack.mjs data
      - name: Publish the refreshed pack
        run: |
          git add data/icons.json data/manifest.json
          # Every run publishes a new version, even with the same icons: the version date is the
          # age the app checks (at most 30 days).
          if git diff --cached --quiet; then
            echo "Nothing to publish (pack already built today)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the icon data pack"
          git push
